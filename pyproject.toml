[project]
name = "leakdec"
version = "0.1.0"
description = "Paper 2: soft decoder learning leakage persistence in BB codes"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leakdec", "leakdec.sim", "leakdec.decode", "leakdec.learn", "leakdec.analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
